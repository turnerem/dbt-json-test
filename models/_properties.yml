version: 2

models:
  - name: raw_orders
    description: "Raw orders seed data"
    config:
      meta: {owner: ingestion-team, channel: "#ingestion-alerts"}

  - name: raw_customers
    description: "Raw customer seed data"
    config:
      meta: {owner: ingestion-team, channel: "#ingestion-alerts"}

  - name: stg_orders
    description: "Staged orders with completion flag"
    config:
      meta: {owner: analytics-team, channel: "#analytics-alerts"}

  - name: customer_orders
    description: "Customer order rollup"
    config:
      meta: {owner: analytics-team, channel: "#analytics-alerts", team_owner: analytics-team}
    columns:
      - name: customer_id
        data_tests: [not_null]

  - name: broken_orders
    description: "Intentionally broken model referencing a missing column"
    config:
      meta: {owner: data-platform, channel: "#data-platform-alerts", team_owner: data-platform}
